
name: .NET

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore Invariant.slnx

      - name: Build
        run: dotnet build Invariant.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test Invariant.slnx --no-build --configuration Release --verbosity normal
