
name: .NET

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      # Temporary diagnostic step
      - name: Diagnose central package management
        run: |
          echo "Repository root:"
          pwd

          echo "Package management files:"
          find . \( -name "Directory.Packages.props" -o -name "Directory.Build.props" \) -print

          echo "Central package management setting:"
          dotnet msbuild tests/Invariant.Core.Tests/Invariant.Core.Tests.csproj \
            -getProperty:ManagePackageVersionsCentrally

          echo "Resolved package versions:"
          dotnet msbuild tests/Invariant.Core.Tests/Invariant.Core.Tests.csproj \
            -getItem:PackageVersion

      - name: Restore dependencies
        run: dotnet restore Invariant.slnx

      - name: Build
        run: dotnet build Invariant.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test Invariant.slnx --no-build --configuration Release --verbosity normal
